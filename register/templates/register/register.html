<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 간단한 반응형 정렬 스타일 */
        .page-wrap { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; background-color:#c2e1e4; gap:20px; padding:20px; }
        .card { width:100%; max-width:400px; padding:30px; background-color:#fff; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.15); }
        .submit-btn { width:100%; max-width:400px; padding:12px; background-color:#466d96; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>

<div class="page-wrap">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:25px;">회원가입</h2>

        <form id="signup-form" method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-size:medium; font-weight:bold;">{{ field.label }}</label>
                    <div>{{ field }}</div>
                    {% if field.errors %}
                        <small style="color:red;">{{ field.errors|striptags }}</small>
                    {% endif %}
                </div>
            {% endfor %}
        </form>
    </div>

    <button id="signup-button" type="button" class="submit-btn" onclick="document.getElementById('signup-form').submit()">가입하기</button>
</div>

<script>
    (function(){
        var success = {{ success|yesno:"true,false" }};
        if (success) {
            alert('가입이 완료되었습니다');
            // 확인 후 로그인 페이지로 이동
            try {
                window.location.href = '/accounts/login/';
            } catch (e) {
                // 이동 실패 시 URL에서 success 파라미터만 제거
                if (window.history && window.history.replaceState) {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('success');
                    window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
                }
            }
        }
    })();
</script>

</body>
</html>
