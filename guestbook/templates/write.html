{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 작성</title>
    <link rel="stylesheet" href="{% static 'css/guestbook.css' %}">
</head>
<body>

<div class="container">

    <div class="board-header">
        <h1>새 글 작성</h1>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>작성자</label>
            <input
                type="text"
                value="{% if request.user.is_authenticated %}{{ request.user.username }}{% else %}익명{% endif %}"
                readonly
                class="readonly-input">
        </div>

        <div class="form-group">
            <label for="title">제목</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="100"
                placeholder="제목을 입력해주세요."
                required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea
                id="content"
                name="content"
                rows="12"
                placeholder="게시글 내용을 적어주세요."
                required></textarea>
        </div>

        <div class="button-group">
            <a href="{% url 'guestbook' %}" class="cancel-btn">취소</a>
            <button type="submit" class="submit-btn">등록</button>
        </div>

    </form>
</div>

</body>
</html>
