{% load static %}
<!DOCTYPE html>
<html>

<head>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* 간단한 로그인 모달 스타일 */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal { background: white; padding: 20px; border-radius: 6px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal h3 { margin-top: 0; }
        .modal .actions { text-align: right; margin-top: 12px; }
        .modal button { margin-left: 8px; }
    </style>

</head>

<body>

    <div id="calendar"></div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal" role="document">
            <h3>로그인이 필요합니다</h3>
            <p>일정을 추가하려면 먼저 로그인하세요.</p>
            <div class="actions">
                <button id="modalClose">취소</button>
                <a href="{% url 'login' %}"><button id="modalLogin">로그인</button></a>
            </div>
        </div>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function () {

            // 템플릿에서 인증 여부를 가져옵니다.
            {% if user.is_authenticated %}
            const isAuthenticated = true;
            {% else %}
            const isAuthenticated = false;
            {% endif %}

            // 모달 제어
            const loginModal = document.getElementById('loginModal');
            const modalClose = document.getElementById('modalClose');
            if (modalClose) modalClose.addEventListener('click', () => { loginModal.style.display = 'none'; });

            var calendarEl = document.getElementById('calendar');

            var calendar = new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',

                locale: 'ko',

                selectable: true,

                events: '/events/',

                select: function (info) {
                    if (!isAuthenticated) {
                        // 비로그인 사용자에게 모달 표시
                        loginModal.style.display = 'flex';
                        return;
                    }

                    let title = prompt("일정 이름");

                    if (title) {

                        fetch("/add/", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": getCookie("csrftoken")
                            },

                            body: JSON.stringify({

                                title: title,
                                start: info.startStr,
                                end: info.endStr

                            })

                        }).then((res) => {
                            if (res.ok) calendar.refetchEvents();
                            else res.json().then(j => alert(j.error || '생성 실패'));
                        });

                    }

                }

            });

            calendar.render();

        });

        function getCookie(name) {

            let cookieValue = null;

            if (document.cookie && document.cookie !== '') {

                const cookies = document.cookie.split(';');

                for (let i = 0; i < cookies.length; i++) {

                    const cookie = cookies[i].trim();

                    if (cookie.substring(0, name.length + 1) === (name + '=')) {

                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                        break;

                    }

                }

            }

            return cookieValue;

        }

    </script>

</body>

</html>
